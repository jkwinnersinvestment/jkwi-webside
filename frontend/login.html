<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | JKWI</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">

                <div class="brand-mark">
                    JKWI
                </div>

                <p>
                    JK WINNERS INVESTMENT
                </p>

            </div>


            <div class="login-heading">

                <span>SECURE ACCESS</span>

                <h1>Welcome back</h1>

                <p>
                    Sign in to access your JKWI platform.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="identifier">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>Remember me</span>

                    </label>


                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>


                <div
                    class="login-message"
                    id="loginMessage"
                ></div>

            </form>


            <div class="login-footer">

                <span>
                    JKWI Secure Platform
                </span>

                <span>
                    © 2026 JK Winners Investment
                </span>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>
</html>
